# Pages CMS 2.x — https://pagescms.org/docs/configuration/
# Preserve merge mode: focused editors share siteContent.json.
media:
  - name: photographs
    label: Photographs and media
    input: public/images
    output: /images
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - gif
      - svg
    rename: safe
settings:
  content:
    merge: true
content:
