  - name: profile
    label: Identity, photographs and social links
    type: file
    path: src/data/profile.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    description: Upload your portrait here; it is shared by the hero, About page, and CV identity. The
      gallery stores objects with image, alternative text, and caption, not an array of image URLs.
    fields:
      - name: name
        label: Your name
        type: string
        required: true
        default: ""
      - name: nameIsPlaceholder
        label: Name is a sample
        type: boolean
        default: false
      - name: siteTitle
        label: Website title
        type: string
        required: true
        default: ""
      - name: role
        label: Role
        type: string
        required: true
        default: ""
      - name: institution
        label: Institution
        type: string
        required: true
        default: ""
      - name: location
        label: Personal location
        type: string
        required: true
        default: ""
        description: Biography location only; astronomical reference coordinates are separate and unchanged.
      - name: email
        label: Contact email
        type: string
        required: false
        default: ""
        pattern: ^([^\s@]+@[^\s@]+\.[^\s@]+|)$
      - name: portrait
        label: Portrait photograph
        type: image
        options:
          media: photographs
        description: Upload/select an image. Add descriptive alternative text. Leave empty to use the
          existing placeholder.
      - name: interests
        label: Interests
        type: string
        list: true
        default: []
      - name: links
        label: Social and professional links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} {institution}"
        fields:
          - name: label
            label: Link label
            type: string
            required: true
            default: ""
          - name: url
            label: URL
            type: string
            required: true
            default: ""
            pattern: ^https?://\S+$
      - name: gallery
        label: Photo gallery
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} {institution}"
        fields:
          - name: src
            label: Photograph
            type: image
            options:
              media: photographs
            description: Upload/select an image. Add descriptive alternative text. Leave empty to use the
              existing placeholder.
          - name: alt
            label: Alternative text
            type: string
            required: false
            default: ""
          - name: caption
            label: Caption
            type: text
            required: false
            default: ""
  - name: academic
    label: Publications and academic experience
    type: file
    path: src/data/academic.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    description: The PDF CV is generated automatically from this data. Leave placeholder enabled until
      every record is verified. IDs must be unique.
    fields:
      - name: education
        label: Education
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} {institution}"
        fields:
          - name: title
            label: Qualification
            type: string
            required: true
            default: ""
          - name: institution
            label: Institution
            type: string
            required: true
            default: ""
          - name: start
            label: Start year / date
            type: string
            required: true
            default: ""
          - name: end
            label: End year / Present
            type: string
            required: true
            default: ""
          - name: description
            label: Description
            type: text
            required: false
            default: ""
      - name: experience
        label: Academic experience
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} {institution}"
        fields:
          - name: title
            label: Position
            type: string
            required: true
            default: ""
          - name: institution
            label: Institution
            type: string
            required: true
            default: ""
          - name: start
            label: Start year / date
            type: string
            required: true
            default: ""
          - name: end
            label: End year / Present
            type: string
            required: true
            default: ""
          - name: description
            label: Description
            type: text
            required: false
            default: ""
      - name: publications
        label: Publications and talks
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} {institution}"
        fields:
          - name: id
            label: Stable ID
            type: string
            required: true
            default: ""
            pattern:
              regex: ^[a-z0-9-]+$
              message: Use lowercase letters, numbers, and hyphens; keep existing IDs stable.
          - name: type
            label: Publication type
            type: select
            required: true
            options:
              values:
                - journal
                - conference
                - preprint
                - poster
                - talk
                - seminar
              multiple: false
          - name: title
            label: Title
            type: string
            required: true
            default: ""
          - name: authors
            label: Authors (in order)
            type: string
            required: true
            list:
              min: 1
              collapsible: false
          - name: venue
            label: Venue
            type: string
            required: true
            default: ""
          - name: date
            label: Publication date
            type: date
            required: true
            options:
              format: yyyy-MM-dd
              time: false
          - name: status
            label: Status
            type: string
            required: true
            default: ""
          - name: placeholder
            label: Sample / placeholder (excluded from CV)
            type: boolean
            default: true
          - name: featured
            label: Show on homepage
            type: boolean
            default: false
          - name: themes
            label: Related research themes
            type: select
            required: false
            options:
              values:
                - reservoir
                - dynamics
                - networks
                - forecasting
              multiple: true
            default: []
          - name: doi
            label: DOI identifier
            type: string
            required: false
            default: ""
            pattern: ^(10\.\d{4,9}/\S+|)$
            description: Identifier only, e.g. 10.1234/example; not a DOI URL.
          - name: arxiv
            label: arXiv identifier
            type: string
            required: false
            default: ""
            pattern: ^(\d{4}\.\d{4,5}(v\d+)?|[a-z-]+(\.[A-Z]{2})?/\d{7}(v\d+)?|)$
          - name: pdf
            label: Pdf URL
            type: string
            required: false
            default: ""
            pattern:
              regex: ^(https?://\S+|/(?!/)\S*|)$
              message: Use an HTTPS URL, /local/path, or leave empty.
          - name: code
            label: Code URL
            type: string
            required: false
            default: ""
            pattern:
              regex: ^(https?://\S+|/(?!/)\S*|)$
              message: Use an HTTPS URL, /local/path, or leave empty.
          - name: slides
            label: Slides URL
            type: string
            required: false
            default: ""
            pattern:
              regex: ^(https?://\S+|/(?!/)\S*|)$
              message: Use an HTTPS URL, /local/path, or leave empty.
          - name: bibtex
            label: BibTeX citation
            type: text
            required: false
            default: ""
  - name: projects
    label: Featured GitHub projects
    type: file
    path: src/data/projects.cms.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    description: This safe object-shaped editor is authoritative. The build generates the existing
      projects.json array; an empty list is supported.
    fields:
      - name: projects
        label: Project cards
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} {institution}"
        fields:
          - name: id
            label: Stable ID
            type: string
            required: true
            default: ""
            pattern:
              regex: ^[a-z0-9-]+$
              message: Use lowercase letters, numbers, and hyphens; keep existing IDs stable.
          - name: title
            label: Project title
            type: string
            required: true
            default: ""
          - name: description
            label: Short description
            type: text
            required: true
            default: ""
          - name: technologies
            label: Technologies
            type: string
            list: true
            default: []
          - name: repository
            label: GitHub repository URL
            type: string
            required: false
            default: ""
            pattern: ^(https://github\.com/[\w.-]+/[\w.-]+/?|)$
          - name: demo
            label: Demo URL
            type: string
            required: false
            default: ""
            pattern: ^(https?://\S+|/(?!/)\S*|)$
          - name: image
            label: Project image
            type: image
            options:
              media: photographs
            description: Upload/select an image. Add descriptive alternative text. Leave empty to use the
              existing placeholder.
          - name: publication
            label: Related publication ID
            type: string
            required: false
            default: ""
            description: Existing ID from Publications, or leave blank.
          - name: themes
            label: Related research themes
            type: select
            required: false
            options:
              values:
                - reservoir
                - dynamics
                - networks
                - forecasting
              multiple: true
            default: []
          - name: featured
            label: Show on homepage
            type: boolean
            default: false
          - name: placeholder
            label: Sample / placeholder
            type: boolean
            default: true
        default: []
  - name: journal
    label: Journal / blog articles
    type: collection
    path: src/content/journal
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{primary}.md"
      field: create
    operations:
      create: true
      rename: false
      delete: false
    view:
      primary: title
      fields:
        - title
        - date
        - category
        - draft
      sort:
        - date
        - title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Article title
        type: string
        required: true
        default: ""
      - name: description
        label: Short summary
        type: text
        required: true
        default: ""
      - name: date
        label: Publication date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
          time: false
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - Research Notes
            - Conferences & Travel
            - Mathematics
            - Life & Other Things
          multiple: false
      - name: tags
        label: Tags
        type: string
        list: true
        default: []
      - name: cover
        label: Cover photograph
        type: image
        options:
          media: photographs
        description: Upload/select an image. Add descriptive alternative text. Leave empty to use the
          existing placeholder.
      - name: coverAlt
        label: Cover alternative text
        type: string
        required: false
        default: ""
      - name: sample
        label: Sample / demonstration article
        type: boolean
        default: false
      - name: draft
        label: Draft — hide from the website
        type: boolean
        default: true
      - name: body
        label: Article body
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
          media: photographs
        description: Use Editor for normal prose. Use Source mode for existing LaTeX, code fences, or
          unsupported Markdown; inspect the PR diff before merging.
